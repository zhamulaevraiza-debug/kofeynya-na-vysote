// DOM-морфинг: сохраняет позиции скролла, фокус и не перезапускает анимации
const nodeKey = n => n.nodeType === 1 ? n.getAttribute('data-key') : null;

function syncAttrs(o, n) {
  for (const a of [...o.attributes]) if (!n.hasAttribute(a.name)) o.removeAttribute(a.name);
  for (const a of [...n.attributes]) if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value);
}

function morphEl(o, n) {
  syncAttrs(o, n);
  if (o.tagName === 'INPUT' || o.tagName === 'TEXTAREA') {
    if (o.value !== n.value) o.value = n.value;
  }
  morphChildren(o, n);
}

function morphChildren(o, n) {
  const newKids = [...n.childNodes];
  // ключевые узлы, исчезнувшие из нового дерева, убираем заранее — иначе они
  // сдвигают якоря и соседи переприкрепляются (перезапуская анимации)
  const newKeys = new Set();
  for (const nk of newKids) { const kk = nodeKey(nk); if (kk) newKeys.add(kk); }
  for (const k of [...o.childNodes]) { const kk = nodeKey(k); if (kk && !newKeys.has(kk)) o.removeChild(k); }
  const oldKids = [...o.childNodes];
  const oldByKey = new Map();
  for (const k of oldKids) { const kk = nodeKey(k); if (kk) oldByKey.set(kk, k); }
  const consumed = new Set();
  let oi = 0;
  let prev = null;
  for (const nk of newKids) {
    let match = null;
    const nkKey = nodeKey(nk);
    if (nkKey != null) {
      const cand = oldByKey.get(nkKey);
      if (cand && cand.tagName === nk.tagName) match = cand;
    } else {
      while (oi < oldKids.length) {
        const cand = oldKids[oi];
        if (consumed.has(cand) || nodeKey(cand) != null) { oi++; continue; }
        if (cand.nodeType === nk.nodeType && (nk.nodeType !== 1 || cand.tagName === nk.tagName)) { match = cand; break; }
        // осиротевшие пробельные текстовые узлы пропускаем, чтобы удалённый
        // сосед не сдвигал сопоставление всех последующих элементов
        if (cand.nodeType === 3 && !cand.nodeValue.trim()) { oi++; continue; }
        break;
      }
    }
    let placed;
    if (match) {
      consumed.add(match);
      if (nk.nodeType === 3) { if (match.nodeValue !== nk.nodeValue) match.nodeValue = nk.nodeValue; }
      else morphEl(match, nk);
      placed = match;
    } else {
      placed = nk;
      consumed.add(placed);
    }
    const anchor = prev ? prev.nextSibling : o.firstChild;
    if (placed !== anchor) {
      // moveBefore сохраняет состояние поддерева (анимации, фокус) при переносе
      if (o.moveBefore && placed.parentNode === o) o.moveBefore(placed, anchor);
      else o.insertBefore(placed, anchor);
    }
    prev = placed;
  }
  let cur = prev ? prev.nextSibling : o.firstChild;
  while (cur) { const nx = cur.nextSibling; o.removeChild(cur); cur = nx; }
}

              if (!(S.npName.trim() && S.npPrice)) return;

              set({ custom: [...S.custom, { id, cat: S.npCat, n: S.npName.trim(), v: '', p: +S.npPrice, img: '', d: 'Новинка от бариста' }], npName: '', npPrice: '' });

    const avg = paid.length ? Math.round(revenue / paid.length) : 0;
    const PAYS = ['Банковская карта', 'Онлайн-оплата', 'На кассе'];
    const byPay = [0, 0, 0];
    paid.forEach(o => { byPay[o.pay || 0] += orderTotal(o); });
    const byCat = {}, byItem = {}, byHour = {};
    paid.forEach(o => {
      // Позиции пересчитываем в фактически оплаченные суммы: иначе разбивки
      // по категориям и позициям не сходились бы с выручкой на величину скидки.
      const gross = o.lines.reduce((a, l) => a + l[2], 0);
      const k = gross ? orderTotal(o) / gross : 0;
      o.lines.forEach(l => {
        const v = l[2] * k;
        const cat = catOf(l[0]);
        byCat[cat] = (byCat[cat] || 0) + v;
        const n = String(l[0]).replace(/\s*×\d+$/, '');
        byItem[n] = (byItem[n] || 0) + v;
      });
      const h = String(o.time).slice(0, 2) + ':00';
      byHour[h] = (byHour[h] || 0) + orderTotal(o);
    });
    const rounded = obj => Object.entries(obj).map(([n, v]) => [n, Math.round(v)]);
    const bars = (pairs, unit) => {
      const max = Math.max(1, ...pairs.map(x => x[1]));
      return pairs.map(([n, v]) => `
        <div style="display:flex;align-items:center;gap:10px">
          <div style="flex:1;min-width:0;font:600 12.5px Manrope;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n)}</div>
          <div style="font:700 12px Manrope;white-space:nowrap">${v.toLocaleString('ru-RU')} ${unit}</div>
          <div style="width:110px;height:6px;border-radius:99px;background:var(--line2);overflow:hidden;flex:none">
            <div style="width:${Math.round(v / max * 100)}%;height:100%;background:linear-gradient(90deg,#d3a35c,#b07f3a)"></div>
          </div>
        </div>`).join('');
    };
    const card = (title, body, note) => `
      <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;animation:fadeUp .35s ease both">
        <div style="font:600 17px 'Cormorant Garamond',serif;margin-bottom:12px">${title}</div>
        <div style="display:grid;gap:9px">${body}</div>
        ${note ? `<div style="font:600 11px Manrope;color:var(--dim);margin-top:12px">${note}</div>` : ''}
      </div>`;
    const stats = [[revenue.toLocaleString('ru-RU') + ' ₽', 'Выручка за смену'], [avg + ' ₽', 'Средний чек'], [paid.length, 'Оплаченных заказов'], [pipeline.toLocaleString('ru-RU') + ' ₽', 'В очереди']];
    const topItems = rounded(byItem).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const hours = Object.entries(byHour).sort();
    content = `<div data-key="sv-fin">
      <div style="font:600 24px 'Cormorant Garamond',serif;margin-bottom:16px">Финансы</div>
      <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:20px">
        ${stats.map(([v, l]) => `<div style="background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;animation:fadeUp .35s ease both">
          <div style="font:800 22px Manrope;color:var(--goldT)">${v}</div>
          <div style="font:600 12px Manrope;color:var(--sub);margin-top:3px">${l}</div>
        </div>`).join('')}
      </div>
      <div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
        ${card('Способы оплаты', bars(PAYS.map((n, i) => [n, byPay[i]]), '₽'), 'Заказы со статусом «Новый» ещё не учтены')}
        ${card('По категориям', bars(rounded(byCat).sort((a, b) => b[1] - a[1]), '₽'), 'Суммы указаны с учётом скидки — сходятся с выручкой')}
        ${card('Топ позиций', bars(topItems, '₽'))}
        ${card('Выручка по часам', bars(hours, '₽'), 'Час определяется по времени приёма заказа')}
      </div>
    </div>`;
  } else if (S.sview === 'notifx') {
    const KIND = {
      order: ['rgba(201,151,78,.16)', 'var(--goldT)', 'З'],
      ready: ['rgba(111,191,138,.14)', '#6fbf8a', '✓'],
      book:  ['rgba(201,151,78,.16)', 'var(--goldT)', 'Б'],
      stock: ['var(--hov)', 'var(--sub2)', 'М'],
      shift: ['var(--hov)', 'var(--sub2)', 'С']
    };
    const feed = S.snotifs || [];
    content = `<div data-key="sv-notifx">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
        <div style="font:600 24px 'Cormorant Garamond',serif">Уведомления</div>
        ${S.sunread > 0 ? `<div style="padding:4px 11px;border-radius:99px;background:${GG};color:#231b0e;font:800 11px Manrope">${S.sunread} новых</div>` : ''}
        <div style="flex:1"></div>
        ${S.sunread > 0 ? `<div data-c="${act(() => { set({ sunread: 0 }); showToast('Все уведомления отмечены прочитанными'); })}" class="h-gold" style="padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);font:700 12px Manrope;cursor:pointer">Отметить прочитанными</div>` : ''}
      </div>
      ${feed.length === 0 ? '<div style="padding:50px 0;text-align:center;color:var(--sub);font:600 14px Manrope">Событий пока нет</div>' : ''}
      <div style="display:grid;gap:8px;max-width:720px">
        ${feed.map((n, i) => {
          const k = KIND[n.kind] || KIND.order;
          const fresh = i < (S.sunread || 0);
          return `
          <div style="display:flex;align-items:flex-start;gap:11px;background:var(--card);border:1px solid ${fresh ? 'rgba(201,151,78,.4)' : 'var(--line)'};border-radius:13px;padding:12px 14px;animation:fadeUp .3s ease both">
            <div style="width:30px;height:30px;border-radius:9px;flex:none;background:${k[0]};color:${k[1]};display:flex;align-items:center;justify-content:center;font:800 12px Manrope">${k[2]}</div>
            <div style="flex:1;min-width:0"><div style="font:600 13px/1.45 Manrope">${esc(n.text)}</div>
            <div style="font:600 11px Manrope;color:var(--sub);margin-top:3px">${esc(n.time)}</div></div>
            ${fresh ? '<div style="width:7px;height:7px;border-radius:50%;background:#c9974e;margin-top:6px;flex:none"></div>' : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  } else if (S.sview === 'profx') {
    const mine = S.orders.filter(o => o.by === 'Ахмад');
    const done = mine.filter(o => o.st === 'done' || o.st === 'ready').length;
    const revenue = mine.reduce((a, o) => a + orderTotal(o), 0);
    const stats = [[mine.length, 'Заказов за смену'], [done, 'Доведено до выдачи'], [revenue.toLocaleString('ru-RU') + ' ₽', 'Сумма по ним']];
    const themeRow = (k, label) => `
      <div data-c="${act(() => set({ theme: k }))}" class="h-gold" style="display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;font:700 13px Manrope;transition:border-color .15s">
        <div style="width:17px;height:17px;border-radius:50%;box-sizing:border-box;transition:all .15s;${S.theme === k ? 'border:5px solid #c9974e' : 'border:2px solid var(--bdr)'}"></div>${label}
      </div>`;
    content = `<div data-key="sv-profx">
      <div style="font:600 24px 'Cormorant Garamond',serif;margin-bottom:16px">Профиль</div>
      <div style="display:grid;gap:16px;max-width:620px">
        <div style="display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;animation:fadeUp .35s ease both">
          ${avatar('А', 58, 22)}
          <div style="flex:1;min-width:0">
            <div style="font:700 17px Manrope">Ахмад</div>
            <div style="font:600 12.5px Manrope;color:var(--sub);margin-top:2px">Бариста · смена 09:00–18:00</div>
          </div>
          ${onShift(11)}
        </div>
        <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
          ${stats.map(([v, l]) => `<div style="background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px">
            <div style="font:800 20px Manrope;color:var(--goldT)">${v}</div>
            <div style="font:600 11.5px Manrope;color:var(--sub);margin-top:3px">${l}</div>
          </div>`).join('')}
        </div>
        <div>
          <div style="font:700 13px Manrope;margin-bottom:10px">Тема панели</div>
          <div style="display:grid;gap:8px">${themeRow('dark', 'Тёмная')}${themeRow('light', 'Светлая')}${themeRow('system', 'Системная')}</div>
        </div>
        <div data-c="${act(() => { slog('Смена закрыта: Ахмад', 'shift'); set({ screen: 'auth', sview: 'orders' }); showToast('Смена закрыта. До встречи!'); })}" class="h-redbg" style="text-align:center;padding:14px;border-radius:13px;border:1px solid rgba(192,86,74,.4);color:#d97666;font:700 13.5px Manrope;cursor:pointer">Завершить смену</div>
      </div>
    </div>`;
  } else {
    const stTabs = [['new','Новые'],['work','В работе'],['ready','Готовы'],['done','Выполненные']].map(([k, label]) => {
      const n = cnt(k); const active = S.sTab === k;
      const pick = act(() => { const first = S.orders.find(o => o.st === k); setS({ sTab: k, sel: first ? first.num : S.sel }); });
      return `<div data-c="${pick}" style="padding:9px 15px;border-radius:99px;cursor:pointer;font:700 12.5px Manrope;transition:all .15s;${active ? `background:${GG};color:#231b0e` : 'background:var(--card);border:1px solid var(--line);color:var(--sub2)'}">${label}${n ? ' ' + n : ''}</div>`;
    }).join('');
    const cards = list.map(o => `
      <div data-c="${act(() => setS({ sel: o.num }))}" class="h-goldb2" style="background:var(--card);border:1px solid ${sel && sel.num === o.num ? 'rgba(201,151,78,.65)' : 'var(--line)'};border-radius:15px;padding:15px 16px;cursor:pointer;transition:border-color .15s;animation:fadeUp .35s ease both">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">
          <div style="font:800 15px Manrope">№${o.num}</div>
          <div style="flex:1"></div>
          <div style="padding:4px 10px;border-radius:99px;font:700 11px Manrope;${TAGS[o.st][1]}">${TAGS[o.st][0]}</div>
        </div>
        <div style="font:600 13px/1.5 Manrope;color:var(--sub2);margin-bottom:7px">${esc(o.lines.map(l => l[0]).join(', '))}</div>
        <div style="display:flex;align-items:center;gap:14px;font:600 11.5px Manrope;color:var(--sub)">
          <div>Время: ${o.time}</div>
          ${o.st === 'work' && o.min > 0 ? `<div style="display:flex;align-items:center;gap:4px">${SVG.clock}${o.min} мин</div>` : ''}
        </div>
      </div>`).join('');
    const selLines = sel ? sel.lines.map(([n, v, p]) => `
      <div style="display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line2);padding-bottom:9px">
        <div style="min-width:0"><div style="font:700 13.5px Manrope">${esc(n)}</div><div style="font:600 11px Manrope;color:var(--sub);margin-top:2px">${esc(v)}</div></div>
        <div style="flex:1"></div>
        <div style="font:700 13px Manrope;white-space:nowrap">${p} ₽</div>
      </div>`).join('') : '';
    const selAdvance = act(() => {
      if (!sel || !NEXT[sel.st]) return;
      const nx = NEXT[sel.st][1];
      const mine = S.myNums.includes(sel.num);
      slog('Заказ №' + sel.num + ' — ' + LBL[nx].toLowerCase(), nx === 'ready' ? 'ready' : 'order');
      const patch = { orders: S.orders.map(o => o.num === sel.num ? { ...o, st: nx, min: 0, by: 'Ахмад', hist: [...(o.hist || []), [LBL[nx], now()]] } : o) };
      if (mine) {
        const msg = nx === 'work' ? 'Заказ №' + sel.num + ' начали готовить ☕' : nx === 'ready' ? '☕ Заказ №' + sel.num + ' готов! Подходите к стойке' : 'Заказ №' + sel.num + ' выдан. Приятного!';
        patch.notifs = [{ text: msg, time: now() }, ...S.notifs];
        patch.unread = S.unread + 1;
        if (nx === 'done') {
          const tot = sel.total || sel.lines.reduce((a, l) => a + l[2], 0);
          const pts = Math.max(1, Math.round(tot * 0.05));
          patch.bonus = S.bonus + pts;
          patch.bonusEv = [['Заказ №' + sel.num, today(), pts], ...S.bonusEv];
          patch.notifs = [{ text: '+' + pts + ' баллов за заказ №' + sel.num, time: now() }, ...patch.notifs];
          patch.unread = S.unread + 2;
        }
      }
      set(patch);
      showToast('Заказ №' + sel.num + (nx === 'work' ? ' в работе' : nx === 'ready' ? ' готов — клиент уведомлён' : ' выдан'));
    });
    content = `<div data-key="sv-orders">
      <div style="font:600 24px 'Cormorant Garamond',serif;margin-bottom:16px">Реестр заказов</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">${stTabs}</div>
      <div style="display:grid;gap:16px;${wide ? 'grid-template-columns:1fr 320px' : ''}">
        <div style="display:grid;gap:12px;align-content:start">
          ${list.length === 0 ? '<div style="padding:50px 0;text-align:center;color:var(--sub);font:600 14px Manrope">В этой колонке пусто</div>' : ''}
          ${cards}
        </div>
        <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;align-self:start;animation:fadeIn .3s ease both">
          <div style="font:600 12px Manrope;color:var(--sub);margin-bottom:4px">Детали заказа</div>
          <div style="font:600 21px 'Cormorant Garamond',serif;margin-bottom:6px">№${sel ? sel.num : '—'}</div>
          <div style="font:700 12.5px Manrope;margin-bottom:2px">Клиент: ${esc(sel && sel.client ? sel.client : 'Гость')}</div>
          <div style="font:600 11.5px Manrope;color:#6fbf8a;margin-bottom:14px">${sel ? ((sel.type === 1 ? 'С собой' : 'В зале') + ' · ' + (['Банковская карта', 'Онлайн-оплата', 'На кассе'][sel.pay || 0]) + ' · Оплачено') : ''}</div>
          <div style="font:700 12px Manrope;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px">Состав заказа</div>
          <div style="display:grid;gap:10px">${selLines}</div>
          <div style="display:flex;margin-top:14px;font:800 15px Manrope"><div>Итого</div><div style="flex:1"></div><div>${sel ? orderTotal(sel) : 0} ₽</div></div>
          ${sel && NEXT[sel.st] ? `<div data-c="${selAdvance}" class="a98" style="margin-top:16px;height:44px;border-radius:12px;background:${GG};color:#231b0e;display:flex;align-items:center;justify-content:center;font:800 13.5px Manrope;cursor:pointer">${NEXT[sel.st][0]}</div>` : ''}
        </div>
      </div>
    </div>`;
  }

  return `
  <div data-key="view-staff" style="display:flex;${wide ? '' : 'flex-direction:column;'}max-width:1280px;margin:0 auto;height:100dvh;overflow:hidden">
    <div data-key="st-side" style="${wide ? 'width:230px;flex:none;border-right:1px solid var(--line);overflow-y:auto;' : 'border-bottom:1px solid var(--line);flex:none;'}padding:22px 18px;box-sizing:border-box;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px">
        ${SVG.logoSmall}
        <div><div style="font:600 13px 'Cormorant Garamond',serif;letter-spacing:.04em">КОФЕЙНЯ</div><div style="font:600 11px 'Cormorant Garamond',serif;color:#c9974e;font-style:italic">на высоте</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:18px">
        ${avatar('А', 38, 15)}
        <div style="flex:1;min-width:0"><div style="font:700 13px Manrope">Ахмад</div><div style="font:600 11px Manrope;color:var(--sub)">Бариста</div></div>
        ${onShift(10.5)}
      </div>
      <div style="display:grid;gap:4px;flex:1">${stNav}</div>
      <div data-c="${act(() => setS({ screen: 'auth' }))}" class="h-redbg" style="padding:12px 14px;border-radius:11px;color:#d97666;font:700 13px Manrope;cursor:pointer">Выйти</div>
    </div>
    <div data-key="st-main" style="flex:1;min-width:0;min-height:0;overflow-y:auto;padding:26px 26px 40px;box-sizing:border-box">${content}</div>
  </div>`;
}

function renderAuth() {
  const phoneOk = (S.fPhone.match(/\d/g) || []).length >= 6;
  const authInput = (id, type, inputmode, value, handler, ph) =>
    `<input id="${id}" ${type ? `type="${type}"` : ''} ${inputmode ? `inputmode="${inputmode}"` : ''} data-i="${handler}" value="${esc(value)}" placeholder="${ph}" style="width:100%;box-sizing:border-box;height:50px;padding:0 16px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:rgba(20,17,13,.6);backdrop-filter:blur(6px);color:#f2ecdf;font:600 14px Manrope;outline:none">`;

  let mode = '';
  if (S.authMode === 'welcome') {
    mode = `<div data-key="am-welcome" style="display:grid;gap:12px">
      <div data-c="${act(() => setS({ authMode: 'login', fPhone: S.user ? S.user.phone : '', fPass: '' }))}" class="a98" style="height:52px;border-radius:14px;background:${GG};color:#231b0e;display:flex;align-items:center;justify-content:center;font:800 15px Manrope;cursor:pointer;box-shadow:0 14px 30px -14px rgba(201,151,78,.7)">Войти</div>
      <div data-c="${act(() => setS({ authMode: 'reg', fName: '', fPhone: '', fPass: '', agree: false }))}" class="h-goldbg a98" style="height:52px;border-radius:14px;border:1px solid rgba(201,151,78,.55);color:#e3c48b;display:flex;align-items:center;justify-content:center;font:700 15px Manrope;cursor:pointer">Зарегистрироваться</div>
      <div data-c="${act(() => setS({ screen: 'app', tab: 'home' }))}" class="h-cream" style="padding:10px;text-align:center;color:#b8ad9c;font:600 13px Manrope;cursor:pointer">Пропустить</div>

  return `
  <div data-key="scr-auth" style="position:relative;flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto">

}

          <div style="font:600 24px 'Cormorant Garamond',serif">Профиль</div>
          <div style="flex:1"></div>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--sub2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M19 12a7 7 0 0 0-.14-1.4l2-1.55-2-3.46-2.36.95A7 7 0 0 0 14.06 5L13.7 2.5h-3.4L9.94 5a7 7 0 0 0-2.44 1.4l-2.36-.8-2 3.47 2 1.53a7.1 7.1 0 0 0 0 2.8l-2 1.55 2 3.46 2.36-.95a7 7 0 0 0 2.44 1.4l.36 2.54h3.4l.36-2.54a7 7 0 0 0 2.44-1.4l2.36.95 2-3.46-2-1.55c.1-.46.14-.92.14-1.4z"></path></svg>
        </div>
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;animation:fadeUp .4s ease both">
          ${avatar(name.charAt(0).toUpperCase(), 58, 22)}
          <div><div style="font:700 17px Manrope">${esc(name)}</div><div style="font:600 12.5px Manrope;color:var(--sub);margin-top:2px">${esc(S.user && S.user.phone ? S.user.phone : 'Телефон не указан')}</div></div>
        </div>
        <div style="display:grid;gap:8px">${rows}</div>
        <div data-c="${act(() => set({ screen: 'auth', authMode: 'welcome', user: null, psub: null }))}" class="h-redbg" style="margin-top:18px;text-align:center;padding:14px;border-radius:13px;border:1px solid rgba(192,86,74,.4);color:#d97666;font:700 13.5px Manrope;cursor:pointer">Выйти</div>
      </div>`;
    }
    screen = `<div data-key="scr-profile" style="flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 20px 112px;animation:fadeIn .3s ease both">${sub}</div>`;
  }

  const navItems = [['home','Главная','home'],['menu','Меню','menu'],['order','Заказ','order'],['bonus','Бонусы','bonus'],['profile','Профиль','prof']].map(([key, label, ic]) => {
    const active = S.tab === key;
    return `
    <div data-c="${act(() => setS({ tab: key, product: null }))}" class="a94" style="position:relative;width:58px;height:56px;border-radius:17px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:all .2s;${active ? 'background:rgba(217,188,140,.16);border:1px solid rgba(217,188,140,.45);color:var(--goldT)' : 'color:var(--dim2)'}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${SVG.nav[ic]}</svg>
      <div style="font:600 10px Manrope;margin-top:4px">${label}</div>
      ${key === 'order' && cartCount > 0 ? `<div style="position:absolute;top:2px;right:4px;min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;background:${GG};color:#2a2016;border-radius:99px;font:800 10px/17px Manrope;text-align:center;animation:pop .3s ease both">${cartCount}</div>` : ''}
    </div>`;
  }).join('');
  const navbar = !S.product ? `
  <div data-key="nav" style="position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;height:72px;box-sizing:border-box;border-radius:24px;background:var(--navbg);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:0 4px;box-shadow:0 20px 40px -20px rgba(0,0,0,.8)">${navItems}</div>` : '';

  return statusBar + screen + navbar;
}

// ===================== корневой рендер =====================
function render() {
  actions = [];
  const isDark = dark();
  const vars = isDark
    ? '--bg:#120e0b;--ph:#1a1512;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.08);--ink:#f3ede4;--sub:#a99e8e;--sub2:#c9bfae;--goldT:#d9bc8c;--mut:#c9bfae;--dim:#8f8474;--dim2:#7d7264;--bdr:rgba(255,255,255,.22);--hov:rgba(255,255,255,.1);--av1:rgba(255,255,255,.12);--av2:rgba(255,255,255,.03);--navbg:rgba(30,24,20,.72)'
    : '--bg:#e8dfd0;--ph:#f7f2ea;--card:rgba(255,255,255,.62);--line:rgba(42,32,22,.12);--line2:rgba(42,32,22,.09);--ink:#2a2016;--sub:#7d7264;--sub2:#544b3e;--goldT:#9a7326;--mut:#6f6659;--dim:#8f8474;--dim2:#a89e8e;--bdr:rgba(42,32,22,.25);--hov:rgba(42,32,22,.06);--av1:rgba(255,255,255,.85);--av2:rgba(233,223,205,.9);--navbg:rgba(250,246,238,.72)';

  let inner = '';
  if (S.screen === 'staff') {
    inner = renderStaff();
  } else {
    // Стеклянным панелям нужна подложка, иначе размывать нечего: фотография
    // интерьера уходит в сильное размытие и приглушается тонирующим слоем.
    const tint = isDark
      ? 'linear-gradient(180deg,rgba(26,21,18,.52),rgba(18,14,11,.86))'
      : 'linear-gradient(180deg,rgba(247,242,234,.7),rgba(232,223,208,.9))';
    inner = `
    <div data-key="view-phone" style="max-width:430px;width:100%;box-sizing:border-box;margin:0 auto;height:100dvh;background:var(--ph);position:relative;display:flex;flex-direction:column;box-shadow:0 0 90px rgba(0,0,0,.65);overflow:hidden">
      <img data-key="ph-bg" src="assets/interior.jpg" alt="" style="position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(28px) saturate(.7);opacity:${isDark ? '.4' : '.5'}">
      <div data-key="ph-tint" style="position:absolute;inset:0;background:${tint}"></div>
      <div data-key="ph-body" style="position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column">
        ${S.screen === 'splash' ? renderSplash() : S.screen === 'auth' ? renderAuth() : renderApp()}
      </div>
    </div>`;
  }
  const toast = S.toast ? `<div data-key="toast" style="position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99;box-sizing:border-box;width:min(390px,calc(100% - 40px));background:var(--navbg);border:1px solid rgba(217,188,140,.4);color:var(--ink);padding:12px 18px;border-radius:14px;font:700 12.5px Manrope;box-shadow:0 18px 40px -14px rgba(0,0,0,.6);animation:fadeUp .3s ease both;text-align:center">${esc(S.toast)}</div>` : '';

  // сохранить фокус и каретку через перерисовку
  const ae = document.activeElement;
  let focusId = null, selStart = 0, selEnd = 0;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae.id) {
    focusId = ae.id;
    try { selStart = ae.selectionStart; selEnd = ae.selectionEnd; } catch (e) {}
  }

  const tpl = document.createElement('template');
  tpl.innerHTML = `<div data-key="root" style="${vars};height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;transition:background .35s,color .35s">${inner}${toast}</div>`;
  morphChildren(app, tpl.content);

  document.body.style.background = isDark ? '#120e0b' : '#e8dfd0';
  document.documentElement.style.background = isDark ? '#120e0b' : '#e8dfd0';
  document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';

  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && el !== document.activeElement) {
      el.focus({ preventScroll: true });
      try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
    }
  }
}

// ===================== события =====================
app.addEventListener('click', e => {
  const el = e.target.closest('[data-c]');
  if (el && app.contains(el)) { const fn = actions[+el.dataset.c]; if (fn) fn(e); }
});
app.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.i !== undefined) { const fn = actions[+el.dataset.i]; if (fn) fn(e); }
});

window.addEventListener('resize', () => { S.w = window.innerWidth; render(); });
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onMq = e => setS({ sysDark: e.matches });
  if (mq.addEventListener) mq.addEventListener('change', onMq);
  else if (mq.addListener) mq.addListener(onMq);
}

// ===================== старт =====================
render();

})();
</script>
</body>
</html>
