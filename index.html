html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;background:#120e0b;-webkit-text-size-adjust:100%}
a{color:#d9bc8c;text-decoration:none}a:hover{color:#ecd9b4}

::-webkit-scrollbar{width:0;height:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* из макета Glass */
@keyframes rise{from{opacity:0;transform:translateY(46px) scale(.97)}to{opacity:1;transform:none}}
/* pop для отцентрованного круга: собственный transform нельзя терять */
@keyframes popc{0%{transform:translate(-50%,-50%) scale(.7);opacity:0}70%{transform:translate(-50%,-50%) scale(1.05)}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes sheet{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes zoomIn{from{transform:scale(1.1)}to{transform:scale(1)}}

function themeKey() { return S.theme === 'system' ? (S.sysDark ? 'dark' : 'light') : (THEMES[S.theme] ? S.theme : 'dark'); }
function themeDef() { return THEMES[themeKey()]; }
// Три кружка палитры: фон, поверхность, акцент. «Системная» — половинки тёмной и светлой.
function themeSwatch(k) {
  const t = k === 'system' ? null : THEMES[k];
  const dot = c => `<div style="width:14px;height:14px;border-radius:50%;flex:none;background:${c};border:1px solid rgba(0,0,0,.18)"></div>`;

  return `<div style="display:flex;gap:4px;margin-right:2px">${cols.map(dot).join('')}</div>`;
}
// Выпадающая карточка выбора темы под шапкой главной.
function renderThemePanel() {
  if (!S.themeOpen) return '';

  </div>`;
}

// Демо-заказы получают настоящие временные метки относительно первого запуска:
// «ждёт N мин» и «готовится N мин» считаются от них, а не берутся из констант.
const hhmm = ts => { const d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); };
const seedT = Date.now();
const mk = (num, st, ago, lines, client, phone, pay, type, by) => {

  const tss = { new: ts };
  const hist = [['Заявка отправлена', hhmm(ts)], ['Принят кофейней', hhmm(ts)]];
  if (st === 'work' || st === 'ready' || st === 'done') { tss.work = ts + 2 * 60000; hist.push(['Начали готовить', hhmm(tss.work), by]); }
  if (st === 'ready' || st === 'done') { tss.ready = ts + 9 * 60000; hist.push(['Готов — можно забирать', hhmm(tss.ready), by]); }
  if (st === 'done') { tss.done = ts + 12 * 60000; hist.push(['Выдан клиенту', hhmm(tss.done), by]); }
  return { num, st, time: hhmm(ts), tss, hist, lines, client, phone, pay, type, by, total: lines.reduce((a, l) => a + l[2], 0) };
};

// Брони из хранилища прежних версий: гарантируем id, счётные поля и флаги.
function normalizeBooking(b, i) {
  b = b && typeof b === 'object' ? b : {};
  return {
    id: b.id != null ? b.id : 'b' + i,
    at: +b.at || 0,
    when: String(b.when || '—'),
    guests: Math.max(1, +b.guests || 1),
    name: b.name || 'Гость', phone: b.phone || '—',
    ok: !!b.ok, no: !!b.no, okBy: b.okBy || '', okAt: b.okAt || ''
  };
}

function normalizeOrder(o) {
  const lines = Array.isArray(o.lines) ? o.lines : [];
  const tss = (o.tss && typeof o.tss === 'object') ? { ...o.tss } : {};
  // Заказы из старого формата: момент приёма восстанавливается из строки «ЧЧ:ММ»
  // (это реально записанное время), остальные метки не выдумываются — по ним
  // минуты просто не показываются, пока статус не сменят заново.
  if (!tss.new && /^\d\d:\d\d$/.test(String(o.time || ''))) {
    const d = new Date();
    d.setHours(+o.time.slice(0, 2), +o.time.slice(3, 5), 0, 0);
    if (d.getTime() <= Date.now()) tss.new = d.getTime();
  }
  return {
    ...o, lines, tss,
    st: ['new', 'work', 'ready', 'done', 'cancel'].includes(o.st) ? o.st : 'new',
    hist: Array.isArray(o.hist) ? o.hist : [],
    by: o.by || '',

const avatar = (mono, size, fs, alpha) => `<div style="width:${size}px;height:${size}px;border-radius:50%;background:linear-gradient(135deg,var(--av1),var(--av2));border:1px solid rgba(201,151,78,${alpha || '.5'});display:flex;align-items:center;justify-content:center;font:600 ${fs}px 'Cormorant Garamond',serif;color:#c9974e">${esc(mono)}</div>`;

// ===================== экран персонала =====================
function renderStaff() {
  const wide = S.w >= 980;
  if (S.sview === 'admin' && !isAdmin()) S.sview = 'orders';
  const me = staff();
  const TAGS = { new: ['Новый', 'background:rgba(201,151,78,.16);color:var(--goldT)'], work: ['В работе', 'background:var(--hov);color:var(--sub2)'], ready: ['Готов', 'background:rgba(111,191,138,.18);color:#6fbf8a'], done: ['Выполнен', 'background:var(--line2);color:var(--sub)'], cancel: ['Отменён', 'background:rgba(224,138,122,.14);color:#e08a7a'] };
  const cnt = st => S.orders.filter(o => o.st === st).length;
  const inTab = o => S.sTab === 'done' ? (o.st === 'done' || o.st === 'cancel') : o.st === S.sTab;
  // Очередь — по-честному: новые/в работе/готовые отдаются в порядке поступления
  // (FIFO), закрытые — свежие сверху.
  const list = S.orders.filter(inTab).slice().sort((a, b) => {
    const ta = (a.tss && a.tss.new) || 0, tb = (b.tss && b.tss.new) || 0;
    return S.sTab === 'done' ? tb - ta || b.num - a.num : ta - tb || a.num - b.num;
  });
  // Выбор живёт только внутри открытой колонки: пустая вкладка не подсовывает
  // в детали чужой заказ с активной кнопкой.
  const sel = list.find(o => o.num === S.sel) || list[0] || null;
  const NEXT = { new: ['Взять в работу', 'work'], work: ['Отметить готовым', 'ready'], ready: ['Выдать заказ', 'done'] };
  const LBL = { work: 'Начали готовить', ready: 'Готов — можно забирать', done: 'Выдан клиенту', cancel: 'Заказ отменён' };
  // Таймеры очереди: живые минуты от настоящих меток + подсветка просрочки.
  const timerChip = o => {
    const t = o.tss || {};
    let m = null, label = '', warn = 0;
    if (o.st === 'new') { m = minsSince(t.new); label = 'ждёт'; warn = m >= 10 ? 2 : m >= 5 ? 1 : 0; }
    else if (o.st === 'work') { m = minsSince(t.work); label = 'готовится'; warn = m >= 15 ? 2 : m >= 10 ? 1 : 0; }
    else if (o.st === 'ready') { m = minsSince(t.ready); label = 'ожидает выдачи'; warn = m >= 10 ? 2 : m >= 5 ? 1 : 0; }
    else if (o.st === 'done') { return t.done ? `<div style="display:flex;align-items:center;gap:4px">${SVG.clock}выдан в ${hhmm(t.done)}</div>` : ''; }
    else if (o.st === 'cancel') { return t.cancel ? `<div style="display:flex;align-items:center;gap:4px">отменён в ${hhmm(t.cancel)}</div>` : ''; }
    if (m == null) return '';
    const col = warn === 2 ? 'color:#e08a7a;font-weight:800' : warn === 1 ? 'color:var(--goldT);font-weight:800' : '';
    return `<div style="display:flex;align-items:center;gap:4px;${col}">${SVG.clock}${label} ${m} мин</div>`;
  };

  const SECTIONS = [['dash','Главная'],['orders','Реестр заказов'],['books','Брони'],['menu','Меню и остатки'],['shifts','Смены'],['clients','Клиенты'],['fin','Финансы'],['notifx','Уведомления'],['profx','Профиль'], ...(isAdmin() ? [['admin','Администрирование']] : [])];
  // Один и тот же пункт меню в двух видах: строка бокового меню (широкий экран)
  // и «чип» горизонтальной ленты вкладок (телефон).
  const navItem = ([k, label], chip) => {
    const active = S.sview === k;
    const tap = act(() => setS({ sview: k }));
    const badge = k === 'notifx' && S.sunread > 0
      ? `<span style="margin-left:7px;background:${GG};color:#231b0e;border-radius:99px;padding:1px 7px;font:800 10.5px Manrope">${S.sunread}</span>` : '';
    const shape = chip ? 'flex:none;white-space:nowrap;padding:9px 13px;border-radius:99px;font:700 12.5px Manrope;' : 'padding:11px 14px;border-radius:11px;font:700 13px Manrope;';
    const look = active ? 'background:rgba(201,151,78,.14);color:var(--goldT);border:1px solid rgba(201,151,78,.45)' : chip ? 'background:var(--card);border:1px solid var(--line);color:var(--sub2)' : 'color:var(--sub)';
    return `<div data-c="${tap}" class="h-nav" style="${shape}cursor:pointer;transition:all .15s;${look}">${label}${badge}</div>`;
  };
  const stNav = SECTIONS.map(s => navItem(s, false)).join('');
  const stNavChips = SECTIONS.map(s => navItem(s, true)).join('');

  let content = '';
  if (S.sview === 'dash') {
    const todays = S.orders.filter(isTodayOrder);
    const paidList = todays.filter(isPaid);
    const rev = paidList.reduce((a, o) => a + orderTotal(o), 0);
    const stats = [
      { v: todays.filter(o => o.st !== 'cancel').length, l: 'Заказов сегодня' },
      { v: rev.toLocaleString('ru-RU') + ' ₽', l: 'Выручка · оплачено' },
      { v: (paidList.length ? Math.round(rev / paidList.length) : 0) + ' ₽', l: 'Средний чек' },
      { v: S.orders.filter(o => o.st === 'work').length, l: 'Готовятся сейчас' }
    ];
    // Популярность — в проданных штуках: «Латте ×3» это три латте, отменённые не в счёт.
    const cntM = {};
    todays.filter(o => o.st !== 'cancel').forEach(o => o.lines.forEach(l => {
      const m2 = String(l[0]).match(/ ×(\d+)$/);
      const n = String(l[0]).replace(/ ×\d+$/, '');
      cntM[n] = (cntM[n] || 0) + (m2 ? +m2[1] : 1);
    }));
    const arr = Object.entries(cntM).sort((a, b) => b[1] - a[1]).slice(0, 4);
    const max = arr.length ? arr[0][1] : 1;
    content = `<div data-key="sv-dash">
      <div style="font:600 24px 'Cormorant Garamond',serif;margin-bottom:16px">Сегодня</div>
      <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:20px">
        ${stats.map(s => `<div style="background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;animation:fadeUp .35s ease both">
          <div style="font:800 22px Manrope;color:var(--goldT)">${s.v}</div>
          <div style="font:600 12px Manrope;color:var(--sub);margin-top:3px">${s.l}</div>
        </div>`).join('')}
      </div>
      <div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
        <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px">
          <div style="font:600 17px 'Cormorant Garamond',serif;margin-bottom:12px">Популярные товары</div>
          <div style="display:grid;gap:9px">
            ${arr.map(([n, c], i) => `<div style="display:flex;align-items:center;gap:10px">
              <div style="font:800 12px Manrope;color:var(--sub);width:16px">${i + 1}</div>
              <div style="flex:1;font:700 13px Manrope">${esc(n)}</div>
              <div style="font:600 12px Manrope;color:var(--sub)">${c}</div>
              <div style="width:90px;height:5px;border-radius:99px;background:var(--line2);overflow:hidden"><div style="width:${Math.round(c / max * 100)}%;height:100%;background:linear-gradient(90deg,#d3a35c,#b07f3a)"></div></div>
            </div>`).join('')}
          </div>
          <div style="font:600 11px Manrope;color:var(--dim);margin-top:12px">В проданных штуках, по сегодняшним заказам</div>
        </div>
        <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;align-self:start">
          <div style="font:600 17px 'Cormorant Garamond',serif;margin-bottom:12px">Сотрудники на смене</div>
          <div style="display:grid;gap:10px">
            ${S.staff.map(m => `
              <div style="display:flex;align-items:center;gap:11px">
                ${avatar(m.name.charAt(0), 36, 14, '.45')}
                <div style="flex:1"><div style="font:700 13px Manrope">${esc(m.name)}</div><div style="font:600 11px Manrope;color:var(--sub)">${esc(m.role)} · ${esc(m.shift)}</div></div>
                ${onDuty(m) ? onShift(10.5) : '<div style="font:700 10.5px Manrope;color:var(--dim)">Смена завершена</div>'}
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>`;
  } else if (S.sview === 'books') {
    // Актуальные (ближайшие) сверху; просроченные без решения помечаются
    // отдельно и уже не подтверждаются задним числом.
    // Сначала то, что ждёт решения (ближайшие сверху), затем решённые и просроченные —
    // свежие сверху; длинный хвост не рисуется целиком.
    const pending = b => !b.ok && !b.no && !(b.at && b.at < Date.now());
    const sorted = S.bookings.slice().sort((a, b) => (pending(b) - pending(a)) || (pending(a) ? ((a.at || 0) - (b.at || 0)) : ((b.at || 0) - (a.at || 0))) || (a.id > b.id ? -1 : 1));
    const bLimit = S.bookLimit || 60;
    const rows = sorted.slice(0, bLimit).map(b => {
      const expired = !b.ok && !b.no && b.at && b.at < Date.now();
      const mine = S.myBks.includes(b.id);
      const tag = b.ok ? ['Подтверждена', 'background:rgba(111,191,138,.14);color:#6fbf8a']
        : b.no ? ['Отклонена', 'background:rgba(224,138,122,.14);color:#e08a7a']
        : expired ? ['Просрочена', 'background:var(--line2);color:var(--sub)']
        : ['Новая', 'background:rgba(201,151,78,.16);color:#c9974e'];
      const confirm = act(() => {
        const cur = S.bookings.find(x => x.id === b.id);
        if (!cur || cur.ok || cur.no) return;
        slog('Бронь ' + b.when + ' подтверждена · ' + b.name + ' · ' + staffName(), 'book', true);
        const patch = { bookings: S.bookings.map(x => x.id === b.id ? { ...x, ok: true, okBy: staffName(), okAt: now() } : x) };
        if (mine) {
          patch.notifs = [{ text: '✔ Бронь ' + b.when + ' подтверждена. Ждём вас!', time: now() }, ...S.notifs].slice(0, 25);
          patch.unread = Math.min(S.unread + 1, 25);
        }
        set(patch);
        showToast('Бронь подтверждена' + (mine ? ' — клиент уведомлён' : ''));

      const decline = act(() => {
        const cur = S.bookings.find(x => x.id === b.id);

        const patch = { bookings: S.bookings.map(x => x.id === b.id ? { ...x, no: true, okBy: staffName(), okAt: now() } : x) };
        if (mine) {
          patch.notifs = [{ text: 'К сожалению, бронь ' + b.when + ' не подтверждена: нет свободных столиков. Позвоните нам — подберём время', time: now() }, ...S.notifs].slice(0, 25);
          patch.unread = Math.min(S.unread + 1, 25);
        }
        set(patch);
        showToast('Бронь отклонена' + (mine ? ' — клиент уведомлён' : ''));

      return `
      <div data-key="b-${b.id}" style="background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;animation:fadeUp .3s ease both">
        <div style="display:flex;align-items:center;gap:10px">

        <div data-c="${confirm}" class="a96" style="display:inline-flex;padding:10px 16px;border-radius:11px;background:${GG};color:#231b0e;font:800 12.5px Manrope;cursor:pointer">Подтвердить · уведомить клиента</div>
        <div data-c="${decline}" class="a96 h-del" style="display:inline-flex;padding:10px 16px;border-radius:11px;border:1px solid var(--line);color:var(--sub2);font:800 12.5px Manrope;cursor:pointer">Отклонить</div>
        </div>` : ''}
      </div>`;
    }).join('');
    content = `<div data-key="sv-books">
      <div style="font:600 24px 'Cormorant Garamond',serif;margin-bottom:16px">Брони столиков</div>
      ${sorted.length > bLimit ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;max-width:560px;font:600 12px Manrope;color:var(--sub)">Показаны ${bLimit} из ${sorted.length} — сначала те, что ждут решения<div style="flex:1"></div><div data-c="${act(() => setS({ bookLimit: bLimit + 100 }))}" class="h-goldc" style="color:var(--goldT);cursor:pointer;font:700 12px Manrope">Показать ещё</div></div>` : ''}
      ${S.bookings.length === 0 ? '<div style="padding:50px 0;text-align:center;color:var(--sub);font:600 13.5px Manrope">Броней пока нет</div>' : ''}

    </div>`;
  } else if (S.sview === 'menu') {
    const canAdd = S.npName.trim() && +S.npPrice > 0;
    const npCats = CATS.map(([k, label]) => `<div data-c="${act(() => setS({ npCat: k }))}" style="padding:8px 12px;border-radius:9px;cursor:pointer;font:700 11.5px Manrope;${S.npCat === k ? `background:${GG};color:#231b0e` : 'background:var(--hov);color:var(--sub2)'}">${label}</div>`).join('');
    const rows = allProducts().map(m => {
      const off = !!S.hidden[m.id];
      const cat = (CATS.find(c => c[0] === m.cat) || ['', '—'])[1];
      return `<div style="display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;animation:fadeUp .3s ease both">
        ${S.custom.some(x => x.id === m.id) ? `<label title="Сменить фото" style="position:relative;width:40px;height:40px;border-radius:11px;flex:none;cursor:pointer;${m.img ? `background:url(&quot;${esc(m.img)}&quot;) center/cover no-repeat` : 'background:var(--hov);display:flex;align-items:center;justify-content:center;color:var(--goldT)'};${off ? 'opacity:.4' : ''}">
          <input type="file" accept="image/*" data-p="${m.id}" style="display:none">${m.img ? '' : SVG_CAMERA}
          <div style="position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;background:${GG};color:#231b0e;display:flex;align-items:center;justify-content:center;font:800 11px Manrope;border:2px solid var(--ph)">+</div>

          <div style="font:700 13px Manrope;${off ? 'opacity:.45;text-decoration:line-through' : ''}">${esc(m.n)}</div>

        </div>
        <div data-c="${act(() => { slog((off ? 'Позиция возвращена в меню: ' : 'Позиция скрыта: ') + m.n + ' · ' + staffName(), 'stock', true); set({ hidden: { ...S.hidden, [m.id]: !off } }); })}" style="padding:7px 11px;border-radius:9px;font:700 11px Manrope;cursor:pointer;user-select:none;${off ? 'background:var(--hov);color:var(--sub)' : 'background:rgba(111,191,138,.13);color:#6fbf8a'}">${off ? 'Скрыт' : 'В меню'}</div>
        ${S.custom.some(x => x.id === m.id) ? `<div data-c="${act(() => {

        })}" class="h-del" style="width:30px;height:30px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dim)">✕</div>` : ''}
      </div>`;

// ===================== PIN персонала =====================
// В панель — только по личному коду сотрудника. После 5 ошибок ввод
// блокируется на 30 секунд. PIN нигде не сохраняется, в состоянии — только id.
function staffPinInput(d) {
  if (S.sPinLock > Date.now()) { showToast('Слишком много попыток — подождите полминуты'); return; }
  if (!S.sPinWho) { showToast('Сначала выберите сотрудника'); return; }
  if (d === 'del') { setS({ sPin: S.sPin.slice(0, -1) }); return; }
  const p = (S.sPin + d).slice(0, 4);
  if (p.length < 4) { setS({ sPin: p }); return; }
  const emp = S.staff.find(x => x.id === S.sPinWho);
  if (emp && p === emp.pin) {
    slog('Вход в панель: ' + emp.name, 'shift', true);
    const off = { ...S.offShift }; delete off[emp.id];
    set({ staffId: emp.id, offShift: off, screen: 'staff', sPin: '', sPinErr: 0, sPinLock: 0 });
    showToast('Здравствуйте, ' + emp.name + '!');
  } else {
    const n = S.sPinErr + 1;
    const patch = { sPin: '', sPinErr: n >= 5 ? 0 : n };
    if (n >= 5) patch.sPinLock = Date.now() + 30000;
    setS(patch);
    if (n >= 5) save();
    showToast(n >= 5 ? 'Слишком много попыток — вход закрыт на 30 секунд' : 'Неверный PIN, попробуйте ещё раз');
  }
}

// ===================== корневой рендер =====================
function render() {
  actions = [];
  const T = themeDef();
  const isDark = T.dark;
  const vars = T.vars + ';--acc:' + T.acc;

  let inner = '';
  // Прямой доступ в панель без входа невозможен: нет сотрудника — нет панели.
  if (S.screen === 'staff' && !staff()) S.screen = 'spin';
  if (S.screen === 'staff') {
    inner = renderStaff();
  } else {
    // Стеклянным панелям нужна подложка, иначе размывать нечего: фотография
    // интерьера уходит в сильное размытие и приглушается тонирующим слоем.
    inner = `
    <div data-key="view-phone" style="max-width:430px;width:100%;box-sizing:border-box;margin:0 auto;height:100%;background:var(--ph);position:relative;display:flex;flex-direction:column;box-shadow:0 0 90px rgba(0,0,0,.65);overflow:hidden">
      <img data-key="ph-bg" src="assets/interior.jpg" alt="" style="position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(28px) saturate(.7);opacity:${T.op}">
      <div data-key="ph-tint" style="position:absolute;inset:0;background:${T.tint}"></div>
      <div data-key="ph-body" style="position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;box-sizing:border-box;padding-top:env(safe-area-inset-top)">
        ${S.screen === 'splash' ? renderSplash() : S.screen === 'auth' ? renderAuth() : S.screen === 'spin' ? renderStaffPin() : renderApp()}
      </div>
    </div>`;
  }
  // Центрирование через left/right + margin:auto, а не transform: анимация появления
  // перезаписывала transform, и на телефоне плашка уезжала за правый край.
  const toast = S.toast ? `<div data-key="toast" style="position:fixed;top:calc(18px + env(safe-area-inset-top));left:0;right:0;margin:0 auto;z-index:99;box-sizing:border-box;width:min(390px,calc(100% - 40px));background:var(--navbg);border:1px solid rgba(217,188,140,.4);color:var(--ink);padding:12px 18px;border-radius:14px;font:700 12.5px Manrope;box-shadow:0 18px 40px -14px rgba(0,0,0,.6);animation:fadeUp .3s ease both;text-align:center">${esc(S.toast)}</div>` : '';

  // сохранить фокус и каретку через перерисовку
  const ae = document.activeElement;
  let focusId = null, selStart = 0, selEnd = 0;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae.id) {
    focusId = ae.id;
    try { selStart = ae.selectionStart; selEnd = ae.selectionEnd; } catch (e) {}
  }

  const tpl = document.createElement('template');
  const storageWarn = S.storageFull ? `<div data-key="storage-warn" style="position:fixed;left:0;right:0;bottom:0;z-index:98;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#7a2e22;color:#fff;font:700 12.5px/1.4 Manrope;text-align:center">Хранилище браузера переполнено — изменения не сохраняются. Освободите место или очистите старые данные в браузере.</div>` : '';
  tpl.innerHTML = `<div data-key="root" style="${vars};position:fixed;inset:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;transition:background .35s,color .35s">${inner}${toast}${storageWarn}</div>`;
  morphChildren(app, tpl.content);

  document.body.style.background = T.bg;
  document.documentElement.style.background = T.bg;
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc && tc.content !== T.bg) tc.content = T.bg;
  document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';

  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && el !== document.activeElement) {
      el.focus({ preventScroll: true });
      try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
    }
  }
}

// ===================== события =====================
app.addEventListener('click', e => {
  const el = e.target.closest('[data-c]');
  if (el && app.contains(el)) { const fn = actions[+el.dataset.c]; if (fn) fn(e); }
});
// Фото блюда: файл читается, обрезается в квадрат и сжимается прямо на устройстве,
// в состояние уходит небольшой data:-снимок — как у остальных позиций меню.
app.addEventListener('change', e => {
  const el = e.target;
  if (!el.dataset || el.dataset.p === undefined) return;
  const f = el.files && el.files[0];
  if (!f) return;
  const target = el.dataset.p;
  if (target === 'import') {
    // Восстановление из файла экспорта: проверяем форму записи и перечитываем страницу
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const obj = JSON.parse(String(rd.result));
        if (!obj || !Array.isArray(obj.orders)) throw new Error('bad');
        localStorage.setItem('knv2', JSON.stringify(obj));
        location.reload();
      } catch (err) { showToast('Это не файл данных кофейни'); }
    };
    rd.readAsText(f);
    return;
  }
  readPhoto(f, data => {
    if (target === 'new') { setS({ npImg: data }); return; }
    const m = S.custom.find(x => x.id === target);
    if (!m) return;
    slog('Обновлено фото: ' + m.n + ' · ' + staffName(), 'stock', true);
    set({ custom: S.custom.map(x => x.id === target ? { ...x, img: data } : x) });
    showToast('Фото «' + m.n + '» обновлено');
  });
});
app.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.i !== undefined) { const fn = actions[+el.dataset.i]; if (fn) fn(e); }
});

let rzT;
// Разметка зависит от ширины только через два порога — перерисовка нужна лишь
// при их пересечении, а не на каждый пиксель и не при показе клавиатуры.
const bp = w => (w >= 980 ? 2 : w <= 520 ? 0 : 1);
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { const w = window.innerWidth; const changed = bp(w) !== bp(S.w); S.w = w; if (changed) render(); }, 80); });

// Вторая вкладка сохранила состояние — подхватываем её данные вместо того,
// чтобы молча затереть их своей следующей записью.
window.addEventListener('storage', e => {
  if (e.key !== 'knv2' || e.newValue == null) return;
  let nv = {};
  try { nv = JSON.parse(e.newValue) || {}; } catch (err) { return; }
  Object.assign(S, {
    theme: nv.theme || S.theme, user: nv.user || null, myNums: nv.myNums || [],
    notifs: nv.notifs || [], unread: Math.min(nv.unread || 0, (nv.notifs || []).length),
    snotifs: nv.snotifs || [], sunread: Math.min(nv.sunread || 0, (nv.snotifs || []).length),
    bonus: nv.bonus != null ? nv.bonus : S.bonus, bonusEv: nv.bonusEv || S.bonusEv,
    custom: nv.custom || [], hidden: nv.hidden || {}, favs: nv.favs || {},
    staff: Array.isArray(nv.staff) && nv.staff.length ? nv.staff : S.staff, cfg: { ...DEFAULT_CFG, ...(nv.cfg || {}) },
    orders: (Array.isArray(nv.orders) ? nv.orders : []).map(normalizeOrder),
    cards: nv.cards || [], mainCard: nv.mainCard || 0,
    bookings: (Array.isArray(nv.bookings) ? nv.bookings : []).map(normalizeBooking),
    staffId: nv.staffId || null, offShift: nv.offShift || {}, myBks: nv.myBks || []
  });
  render();
});

// Живые таймеры очереди: пока открыта панель, минуты «ждёт/готовится»
// обновляются сами раз в полминуты (морфинг делает перерисовку дешёвой).
// Минутные метки живут только в очереди (новые/в работе/готовы) и на экране PIN
// (обратный отсчёт блокировки); архив и остальные разделы от часов не зависят.
setInterval(() => {
  if (document.hidden) return;
  if (S.screen === 'spin' || (S.screen === 'staff' && S.sview === 'orders' && S.sTab !== 'done')) render();
}, 30000);

// PIN можно набирать и с физической клавиатуры
document.addEventListener('keydown', e => {
  if (S.screen !== 'spin') return;
  if (/^[0-9]$/.test(e.key)) staffPinInput(e.key);
  else if (e.key === 'Backspace') { e.preventDefault(); staffPinInput('del'); }
  else if (e.key === 'Escape') setS({ screen: 'auth', sPin: '', sPinErr: 0 });
});
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onMq = e => setS({ sysDark: e.matches });
  if (mq.addEventListener) mq.addEventListener('change', onMq);
  else if (mq.addListener) mq.addListener(onMq);
}

// ===================== старт =====================
render();

// PWA: сервис-воркер даёт офлайн-оболочку и установку на главный экран.
// Регистрируется только по http(s) — автономная копия с диска обходится без него.
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    // Новая версия встала на место старой — говорим об этом, но не перезагружаем
    // страницу сами: у бариста может быть открыт заказ.
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController) showToast('Приложение обновлено — изменения вступят в силу при следующем открытии');
      hadController = true;
    });
    setInterval(() => { if (!document.hidden) reg.update().catch(() => {}); }, 60 * 60 * 1000);
  }).catch(() => {});
}

})();
</script>
</body>
</html>
